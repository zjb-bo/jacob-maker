name: Publish portfolio
on:
  push:
    branches: [main]
  issues:
    types: [opened, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
       github.actor == github.repository_owner &&
       startsWith(github.event.issue.title, '[作品] '))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - if: github.event_name == 'issues'
        run: npx playwright install --with-deps chromium
      - if: github.event_name == 'issues'
        run: node scripts/manage.mjs add
      - run: npm run build
      - if: github.event_name == 'issues'
        run: node scripts/manage.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
      - if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body: '作品集已更新：https://zjb-bo.github.io/jacob-maker/ 。添加或删除操作已处理完成。'});
            await github.rest.issues.update({...context.repo, issue_number: context.issue.number, state: 'closed'});
      - if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const detail = fs.existsSync('publish-error.txt') ? fs.readFileSync('publish-error.txt','utf8') : '自动发布未完成，请查看任务日志。';
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body: '发布失败：\n\n```\n'+detail.replace(/`/g,'')+'\n```\n\n请修正请求中的数据，然后关闭并重新打开此请求重试（不要只编辑后等待）。[查看任务日志](https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId+')'});
